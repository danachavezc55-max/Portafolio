<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Contacto | {{titulo}}</title>
    <link rel="stylesheet" href="src/less/style.less" />
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    {{>Header}}

    <main>
        <section class="container">
            <h2 class="section-title">Contacto</h2>
            <p>{{mensaje}}</p>
            <ul class="contact-list">
                <li><strong>Correo:</strong> <a href="mailto:{{email}}">{{email}}</a></li>
                <li><strong>GitHub:</strong> <a href="{{github}}" target="_blank" rel="noopener">{{github}}</a></li>
            </ul>

            <form class="contact-form" action="mailto:{{email}}" method="post" enctype="text/plain">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required />

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required />

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <button type="submit" class="primary-btn">Enviar</button>
            </form>
        </section>
    </main>

    {{>Footer}}
</body>
</html>
